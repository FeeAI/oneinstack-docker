apisix:
  node_listen: 9080
  enable_ipv6: false
  ssl:
    enable: true
    listen:
      - port: 9443
  enable_control: true
  control:
    ip: 127.0.0.1
    port: 9092
  status:
    ip: 127.0.0.1
    port: 7085

nginx_config:
  user: apisix

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    enable_admin_ui: true
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    allow_admin:
      - 0.0.0.0/0
    admin_key:
      - name: admin
        role: admin
        key: ${{APISIX_ADMIN_KEY}}
  etcd:
    host:
      - http://apisix-etcd:2379
    prefix: /apisix
    timeout: 30
