x-web-environment: &web-environment
  TZ: ${TZ:-Asia/Singapore}

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: ${CONTAINER_LOG_MAX_SIZE:-20m}
    max-file: "${CONTAINER_LOG_MAX_FILES:-5}"

x-web-limits: &web-limits
  mem_limit: ${WEB_MEMORY_LIMIT:-512m}
  cpus: ${WEB_CPUS:-1.0}
  pids_limit: ${WEB_PIDS_LIMIT:-256}
  stop_grace_period: 30s
  logging: *default-logging

x-php-limits: &php-limits
  mem_limit: ${PHP_CONTAINER_MEMORY_LIMIT:-1g}
  cpus: ${PHP_CPUS:-2.0}
  pids_limit: ${PHP_PIDS_LIMIT:-512}
  stop_grace_period: 30s
  logging: *default-logging

x-database-limits: &database-limits
  mem_limit: ${DATABASE_MEMORY_LIMIT:-2g}
  cpus: ${DATABASE_CPUS:-2.0}
  pids_limit: ${DATABASE_PIDS_LIMIT:-512}
  stop_grace_period: 60s
  logging: *default-logging

x-runtime-limits: &runtime-limits
  mem_limit: ${RUNTIME_MEMORY_LIMIT:-1g}
  cpus: ${RUNTIME_CPUS:-2.0}
  pids_limit: ${RUNTIME_PIDS_LIMIT:-512}
  stop_grace_period: 30s
  logging: *default-logging

x-auxiliary-limits: &auxiliary-limits
  mem_limit: ${AUXILIARY_MEMORY_LIMIT:-512m}
  cpus: ${AUXILIARY_CPUS:-1.0}
  pids_limit: ${AUXILIARY_PIDS_LIMIT:-256}
  stop_grace_period: 30s
  logging: *default-logging

x-mysql-environment: &mysql-environment
  TZ: ${TZ:-Asia/Singapore}
  MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
  MYSQL_DATABASE: ${DATABASE_NAME:-oneinstack}
  MYSQL_USER: ${DATABASE_USER:-oneinstack}
  MYSQL_PASSWORD_FILE: /run/secrets/database_password

x-mysql-tuning: &mysql-tuning
  - --max-connections=${MYSQL_MAX_CONNECTIONS:-150}
  - --max-allowed-packet=${MYSQL_MAX_ALLOWED_PACKET:-256M}
  - --table-open-cache=${MYSQL_TABLE_OPEN_CACHE:-2048}
  - --thread-cache-size=${MYSQL_THREAD_CACHE_SIZE:-32}
  - --tmp-table-size=${MYSQL_TMP_TABLE_SIZE:-64M}
  - --max-heap-table-size=${MYSQL_MAX_HEAP_TABLE_SIZE:-64M}
  - --innodb-buffer-pool-size=${MYSQL_INNODB_BUFFER_POOL_SIZE:-1G}
  - --slow-query-log=ON
  - --long-query-time=${MYSQL_LONG_QUERY_TIME:-2}
  - --slow-query-log-file=/var/lib/mysql/slow.log

x-php-environment: &php-environment
  TZ: ${TZ:-Asia/Singapore}
  PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT:-256M}
  PHP_MAX_EXECUTION_TIME: ${PHP_MAX_EXECUTION_TIME:-300}
  PHP_MAX_INPUT_TIME: ${PHP_MAX_INPUT_TIME:-300}
  PHP_POST_MAX_SIZE: ${PHP_POST_MAX_SIZE:-256M}
  PHP_UPLOAD_MAX_FILESIZE: ${PHP_UPLOAD_MAX_FILESIZE:-256M}
  PHP_REALPATH_CACHE_SIZE: ${PHP_REALPATH_CACHE_SIZE:-4M}
  PHP_REALPATH_CACHE_TTL: ${PHP_REALPATH_CACHE_TTL:-120}
  PHP_OPCACHE_MEMORY_CONSUMPTION: ${PHP_OPCACHE_MEMORY_CONSUMPTION:-192}
  PHP_OPCACHE_MAX_ACCELERATED_FILES: ${PHP_OPCACHE_MAX_ACCELERATED_FILES:-100000}
  PHP_OPCACHE_REVALIDATE_FREQ: ${PHP_OPCACHE_REVALIDATE_FREQ:-2}
  PHP_FPM_MAX_CHILDREN: ${PHP_FPM_MAX_CHILDREN:-3}
  PHP_FPM_START_SERVERS: ${PHP_FPM_START_SERVERS:-2}
  PHP_FPM_MIN_SPARE_SERVERS: ${PHP_FPM_MIN_SPARE_SERVERS:-1}
  PHP_FPM_MAX_SPARE_SERVERS: ${PHP_FPM_MAX_SPARE_SERVERS:-2}
  PHP_FPM_MAX_REQUESTS: ${PHP_FPM_MAX_REQUESTS:-1000}
  PHP_FPM_REQUEST_TERMINATE_TIMEOUT: ${PHP_FPM_REQUEST_TERMINATE_TIMEOUT:-300s}
  PHP_FPM_REQUEST_SLOWLOG_TIMEOUT: ${PHP_FPM_REQUEST_SLOWLOG_TIMEOUT:-10s}
  PHP_EXTENSIONS: ${PHP_EXTENSIONS:-imagick,redis,memcached,mongodb,pgsql}
  PHP_EXTRA_PECL_PACKAGES: ${PHP_EXTRA_PECL_PACKAGES:-}
  DATABASE_ENGINE: ${DATABASE_ENGINE:-mysql}
  DATABASE_HOST: ${DATABASE_HOST:-mysql}
  DATABASE_PORT: ${DATABASE_PORT:-3306}
  DATABASE_NAME: ${DATABASE_NAME:-oneinstack}
  DATABASE_USER: ${DATABASE_USER:-oneinstack}
  DATABASE_PASSWORD_FILE: /run/secrets/database_password
  MYSQL_HOST: ${DATABASE_HOST:-mysql}
  MYSQL_PORT: ${DATABASE_PORT:-3306}
  MYSQL_DATABASE: ${DATABASE_NAME:-oneinstack}
  MYSQL_USER: ${DATABASE_USER:-oneinstack}
  MYSQL_PASSWORD_FILE: /run/secrets/database_password
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD_FILE: /run/secrets/redis_password
  MEMCACHED_HOST: memcached
  MEMCACHED_PORT: 11211

x-php-build-args: &php-build-args
  PHP_VARIANT: ${PHP_VARIANT:-fpm-alpine}
  PHP_EXTENSIONS: ${PHP_EXTENSIONS:-imagick,redis,memcached,mongodb,pgsql}
  PHP_EXTRA_PECL_PACKAGES: ${PHP_EXTRA_PECL_PACKAGES:-}
  PHPREDIS_VERSION: ${PHPREDIS_VERSION:-6.3.0}
  PHP_MEMCACHED_VERSION: ${PHP_MEMCACHED_VERSION:-3.4.0}
  PHP_MEMCACHE_VERSION: ${PHP_MEMCACHE_VERSION:-8.2}
  PHP_MONGODB_VERSION: ${PHP_MONGODB_VERSION:-2.3.3}
  PHP_IMAGICK_VERSION: ${PHP_IMAGICK_VERSION:-3.8.1}
  PHP_IMAP_VERSION: ${PHP_IMAP_VERSION:-1.0.3}
  PHP_APCU_VERSION: ${PHP_APCU_VERSION:-5.1.28}
  PHP_YAF_VERSION: ${PHP_YAF_VERSION:-3.3.7}
  PHP_PHALCON_VERSION: ${PHP_PHALCON_VERSION:-5.17.0}
  PHP_MSGPACK_VERSION: ${PHP_MSGPACK_VERSION:-3.0.1}
  PHP_YAR_VERSION: ${PHP_YAR_VERSION:-2.3.4}
  PHP_SWOOLE_VERSION: ${PHP_SWOOLE_VERSION:-6.2.2}
  PHP_XDEBUG_VERSION: ${PHP_XDEBUG_VERSION:-3.5.3}
  PHP_SQLSRV_VERSION: ${PHP_SQLSRV_VERSION:-5.13.1}
  MICROSOFT_ODBC_ACCEPT_EULA: ${MICROSOFT_ODBC_ACCEPT_EULA:-N}
  APP_UID: ${APP_UID:-1000}
  APP_GID: ${APP_GID:-1000}

services:
  nginx:
    <<: *web-limits
    profiles: ["web-nginx"]
    build:
      context: ./nginx
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.30.4}
    image: oneinstack/nginx:${NGINX_VERSION:-1.30.4}
    restart: unless-stopped
    environment: *web-environment
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/acme:/var/www/acme:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/certs:/etc/letsencrypt:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/logs/nginx:/var/log/nginx"
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/config/nginx:/etc/nginx/conf.d:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend

  tengine:
    <<: *web-limits
    profiles: ["web-tengine"]
    build:
      context: ./tengine
      args:
        TENGINE_VERSION: ${TENGINE_VERSION:-3.1.0}
        TENGINE_SHA256: ${TENGINE_SHA256:-64ed7155c0c904ce0fe7199c21b8eb6c2abfc267278fa8af832c0cb781e864dc}
    image: oneinstack/tengine:${TENGINE_VERSION:-3.1.0}
    restart: unless-stopped
    environment: *web-environment
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/acme:/var/www/acme:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/certs:/etc/letsencrypt:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/config/tengine:/usr/local/tengine/conf/conf.d:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend

  openresty:
    <<: *web-limits
    profiles: ["web-openresty"]
    build:
      context: ./openresty
      args:
        OPENRESTY_VERSION: ${OPENRESTY_VERSION:-1.31.1.1-2-alpine}
    image: oneinstack/openresty:${OPENRESTY_VERSION:-1.31.1.1-2-alpine}
    restart: unless-stopped
    environment: *web-environment
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/acme:/var/www/acme:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/certs:/etc/letsencrypt:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/config/openresty:/etc/nginx/conf.d:ro"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend

  caddy:
    <<: *web-limits
    profiles: ["web-caddy"]
    build:
      context: ./caddy
      args:
        CADDY_VERSION: ${CADDY_VERSION:-2.11.4}
    image: oneinstack/caddy:${CADDY_VERSION:-2.11.4}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      ACME_EMAIL: ${ACME_EMAIL:-}
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/logs/caddy:/var/log/caddy"
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/config/caddy/sites:/etc/caddy/sites:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/caddy/data:/data"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/caddy/config:/config"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend

  apache:
    <<: *web-limits
    profiles: ["web-apache"]
    build:
      context: ./apache
      args:
        APACHE_VERSION: ${APACHE_VERSION:-2.4.68}
    image: oneinstack/apache:${APACHE_VERSION:-2.4.68}
    restart: unless-stopped
    environment: *web-environment
    depends_on:
      php:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/acme:/var/www/acme:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/certs:/etc/letsencrypt:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/logs/apache:/usr/local/apache2/logs"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/config/apache:/usr/local/apache2/conf/oneinstack:ro"
    healthcheck:
      test: ["CMD", "httpd", "-t"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - frontend
      - backend

  npm:
    <<: *web-limits
    profiles: ["web-npm"]
    image: jc21/nginx-proxy-manager:${NPM_VERSION:-2.15.1}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_BIND:-127.0.0.1}:${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/npm/data:/data"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/npm/letsencrypt:/etc/letsencrypt"
    healthcheck:
      test: ["CMD", "/usr/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    networks:
      - frontend
      - backend

  apisix-etcd:
    <<: *database-limits
    profiles: ["feature-apisix"]
    image: gcr.io/etcd-development/etcd:${ETCD_VERSION:-v3.6.11}
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=apisix-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://apisix-etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://apisix-etcd:2380
      - --initial-cluster=apisix-etcd=http://apisix-etcd:2380
      - --initial-cluster-token=oneinstack-apisix
      - --initial-cluster-state=new
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/apisix/etcd:/etcd-data"
    healthcheck:
      test: ["CMD", "/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  apisix:
    <<: *web-limits
    profiles: ["feature-apisix"]
    build:
      context: ./apisix
      args:
        APISIX_VERSION: ${APISIX_VERSION:-3.17.0-debian}
    image: oneinstack/apisix:${APISIX_VERSION:-3.17.0-debian}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      APISIX_ADMIN_KEY_FILE: /run/secrets/apisix_admin_key
    secrets:
      - apisix_admin_key
    depends_on:
      apisix-etcd:
        condition: service_healthy
    ports:
      - "${APISIX_HTTP_BIND:-0.0.0.0}:${APISIX_HTTP_PORT:-9080}:9080"
      - "${APISIX_HTTPS_BIND:-0.0.0.0}:${APISIX_HTTPS_PORT:-9443}:9443"
      - "${APISIX_ADMIN_BIND:-127.0.0.1}:${APISIX_ADMIN_PORT:-9180}:9180"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7085/status/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - frontend
      - backend

  php:
    <<: *php-limits
    build:
      context: ./php
      args:
        <<: *php-build-args
        PHP_VERSION: ${PHP_VERSION:-8.5}
        PHP_BASE_IMAGE: ${PHP_BASE_IMAGE:-php:${PHP_VERSION:-8.5}-${PHP_VARIANT:-fpm-alpine}}
    image: oneinstack/php:${PHP_VERSION:-8.5}
    restart: unless-stopped
    environment: *php-environment
    secrets:
      - database_password
      - redis_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html"
      - ./php/php.ini:/usr/local/etc/php/conf.d/oneinstack.ini:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - egress

  php82:
    <<: *php-limits
    profiles: ["runtime-php82"]
    build:
      context: ./php
      args:
        <<: *php-build-args
        PHP_VERSION: "8.2"
        PHP_BASE_IMAGE: php:8.2-${PHP_VARIANT:-fpm-alpine}
    image: oneinstack/php:8.2
    restart: unless-stopped
    environment: *php-environment
    secrets:
      - database_password
      - redis_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html"
      - ./php/php.ini:/usr/local/etc/php/conf.d/oneinstack.ini:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - egress

  php83:
    <<: *php-limits
    profiles: ["runtime-php83"]
    build:
      context: ./php
      args:
        <<: *php-build-args
        PHP_VERSION: "8.3"
        PHP_BASE_IMAGE: php:8.3-${PHP_VARIANT:-fpm-alpine}
    image: oneinstack/php:8.3
    restart: unless-stopped
    environment: *php-environment
    secrets:
      - database_password
      - redis_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html"
      - ./php/php.ini:/usr/local/etc/php/conf.d/oneinstack.ini:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - egress

  php84:
    <<: *php-limits
    profiles: ["runtime-php84"]
    build:
      context: ./php
      args:
        <<: *php-build-args
        PHP_VERSION: "8.4"
        PHP_BASE_IMAGE: php:8.4-${PHP_VARIANT:-fpm-alpine}
    image: oneinstack/php:8.4
    restart: unless-stopped
    environment: *php-environment
    secrets:
      - database_password
      - redis_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html"
      - ./php/php.ini:/usr/local/etc/php/conf.d/oneinstack.ini:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - egress

  php85:
    <<: *php-limits
    profiles: ["runtime-php85"]
    build:
      context: ./php
      args:
        <<: *php-build-args
        PHP_VERSION: "8.5"
        PHP_BASE_IMAGE: php:8.5-${PHP_VARIANT:-fpm-alpine}
    image: oneinstack/php:8.5
    restart: unless-stopped
    environment: *php-environment
    secrets:
      - database_password
      - redis_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html"
      - ./php/php.ini:/usr/local/etc/php/conf.d/oneinstack.ini:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/fpm-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - backend
      - egress

  mysql:
    <<: *database-limits
    profiles: ["db-mysql"]
    build:
      context: ./mysql
      args:
        MYSQL_VERSION: ${MYSQL_VERSION:-9.7}
    image: oneinstack/mysql:${MYSQL_VERSION:-9.7}
    restart: unless-stopped
    environment: *mysql-environment
    command: *mysql-tuning
    secrets:
      - database_password
      - mysql_root_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/mysql:/var/lib/mysql"
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat $$MYSQL_ROOT_PASSWORD_FILE) mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  mariadb:
    <<: *database-limits
    profiles: ["db-mariadb"]
    build:
      context: ./mariadb
      args:
        MARIADB_VERSION: ${MARIADB_VERSION:-11.8}
    image: oneinstack/mariadb:${MARIADB_VERSION:-11.8}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MARIADB_DATABASE: ${DATABASE_NAME:-oneinstack}
      MARIADB_USER: ${DATABASE_USER:-oneinstack}
      MARIADB_PASSWORD_FILE: /run/secrets/database_password
    command: *mysql-tuning
    secrets:
      - database_password
      - mysql_root_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/mariadb:/var/lib/mysql"
      - ./mariadb/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MARIADB_PWD=$$(cat $$MARIADB_ROOT_PASSWORD_FILE) healthcheck.sh --connect --innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  percona:
    <<: *database-limits
    profiles: ["db-percona"]
    build:
      context: ./percona
      args:
        PERCONA_VERSION: ${PERCONA_VERSION:-8.4}
    image: oneinstack/percona:${PERCONA_VERSION:-8.4}
    restart: unless-stopped
    environment:
      <<: *mysql-environment
      PERCONA_TELEMETRY_DISABLE: "1"
    command: *mysql-tuning
    secrets:
      - database_password
      - mysql_root_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/percona:/var/lib/mysql"
      - ./percona/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat $$MYSQL_ROOT_PASSWORD_FILE) mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend

  postgresql:
    <<: *database-limits
    profiles: ["db-postgresql"]
    build:
      context: ./postgresql
      args:
        POSTGRES_VERSION: ${POSTGRES_VERSION:-18}
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-postgres:${POSTGRES_VERSION:-18}-alpine}
    image: oneinstack/postgresql:${POSTGRES_VERSION:-18}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      POSTGRES_DB: ${DATABASE_NAME:-oneinstack}
      POSTGRES_USER: ${DATABASE_USER:-oneinstack}
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
      PGDATA: /var/lib/postgresql/data
    secrets:
      - database_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/postgresql:/var/lib/postgresql"
      - ./postgresql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  mongodb:
    <<: *database-limits
    profiles: ["db-mongodb"]
    build:
      context: ./mongodb
      args:
        MONGODB_VERSION: ${MONGODB_VERSION:-8.3}
    image: oneinstack/mongodb:${MONGODB_VERSION:-8.3}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_root_password
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-oneinstack}
      DATABASE_NAME: ${DATABASE_NAME:-oneinstack}
      DATABASE_USER: ${DATABASE_USER:-oneinstack}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
      - mongodb_root_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/mongodb:/data/db"
      - ./mongodb/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username $$MONGO_INITDB_ROOT_USERNAME --password \"$$(cat $$MONGO_INITDB_ROOT_PASSWORD_FILE)\" --authenticationDatabase admin --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  redis:
    <<: *auxiliary-limits
    profiles: ["redis", "cache"]
    build:
      context: ./redis
      args:
        REDIS_VERSION: ${REDIS_VERSION:-8.8}
        REDIS_BASE_IMAGE: ${REDIS_BASE_IMAGE:-redis:${REDIS_VERSION:-8.8}-alpine}
    image: oneinstack/redis:${REDIS_VERSION:-8.8}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD_FILE: /run/secrets/redis_password
    secrets:
      - redis_password
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server /usr/local/etc/redis/redis.conf
        --requirepass "$$(cat "$$REDIS_PASSWORD_FILE")"
        --maxmemory "${REDIS_MAXMEMORY:-384mb}"
        --maxmemory-policy "${REDIS_MAXMEMORY_POLICY:-noeviction}"
        --maxclients "${REDIS_MAX_CLIENTS:-1000}"
        --slowlog-log-slower-than "${REDIS_SLOWLOG_LOG_SLOWER_THAN:-10000}"
        --slowlog-max-len "${REDIS_SLOWLOG_MAX_LEN:-128}"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/redis:/data"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat $$REDIS_PASSWORD_FILE) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  memcached:
    <<: *auxiliary-limits
    profiles: ["memcached", "cache"]
    build:
      context: ./memcached
      args:
        MEMCACHED_VERSION: ${MEMCACHED_VERSION:-1.6}
        MEMCACHED_BASE_IMAGE: ${MEMCACHED_BASE_IMAGE:-memcached:${MEMCACHED_VERSION:-1.6}-alpine}
    image: oneinstack/memcached:${MEMCACHED_VERSION:-1.6}
    restart: unless-stopped
    command:
      - memcached
      - --memory-limit=${MEMCACHED_MEMORY_MB:-128}
      - --conn-limit=${MEMCACHED_MAX_CONNECTIONS:-1024}
      - --threads=${MEMCACHED_THREADS:-4}
      - --user=memcache
    healthcheck:
      test: ["CMD-SHELL", "printf 'version\r\n' | nc -w 2 127.0.0.1 11211 | grep -q '^VERSION'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - backend

  node:
    <<: *runtime-limits
    profiles: ["runtime-node"]
    build:
      context: ./node
      args:
        NODE_VERSION: ${NODE_VERSION:-24}
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:${NODE_VERSION:-24}-alpine}
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: oneinstack/node:${NODE_VERSION:-24}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      NODE_ENV: ${NODE_ENV:-production}
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=768}
      PORT: ${NODE_PORT:-3000}
      DATABASE_HOST: ${DATABASE_HOST:-mysql}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_NAME: ${DATABASE_NAME:-oneinstack}
      DATABASE_USER: ${DATABASE_USER:-oneinstack}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    command: ["/bin/sh", "-lc", "${NODE_COMMAND:-sleep infinity}"]
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html"
    networks:
      - backend
      - egress

  tomcat:
    <<: *runtime-limits
    profiles: ["runtime-tomcat"]
    build:
      context: ./tomcat
      args:
        TOMCAT_VERSION: ${TOMCAT_VERSION:-11.0}
        JDK_VERSION: ${JDK_VERSION:-25}
        TOMCAT_BASE_IMAGE: ${TOMCAT_BASE_IMAGE:-tomcat:${TOMCAT_VERSION:-11.0}-jdk${JDK_VERSION:-25}-temurin}
    image: oneinstack/tomcat:${TOMCAT_IMAGE_TAG:-${TOMCAT_VERSION:-11.0}-temurin-jdk${JDK_VERSION:-25}}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Singapore}
      CATALINA_OPTS: ${CATALINA_OPTS:--Xms256m -Xmx512m}
      DATABASE_HOST: ${DATABASE_HOST:-mysql}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_NAME: ${DATABASE_NAME:-oneinstack}
      DATABASE_USER: ${DATABASE_USER:-oneinstack}
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/tomcat/webapps:/usr/local/tomcat/webapps"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend
      - egress

  phpmyadmin:
    <<: *auxiliary-limits
    profiles: ["tools-phpmyadmin"]
    build:
      context: ./phpmyadmin
      args:
        PHPMYADMIN_VERSION: ${PHPMYADMIN_VERSION:-5-apache}
    image: oneinstack/phpmyadmin:${PHPMYADMIN_VERSION:-5-apache}
    restart: unless-stopped
    environment:
      PMA_HOST: ${DATABASE_HOST:-mysql}
      PMA_PORT: ${DATABASE_PORT:-3306}
      UPLOAD_LIMIT: ${PHPMYADMIN_UPLOAD_LIMIT:-256M}
    ports:
      - "${PHPMYADMIN_BIND:-127.0.0.1}:${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - frontend
      - backend

  adminer:
    <<: *auxiliary-limits
    profiles: ["tools-adminer"]
    image: adminer:${ADMINER_VERSION:-5-standalone}
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: ${DATABASE_HOST:-mysql}
    ports:
      - "${ADMINER_BIND:-127.0.0.1}:${ADMINER_PORT:-8081}:8080"
    networks:
      - frontend
      - backend

  certbot:
    <<: *auxiliary-limits
    profiles: ["acme"]
    build:
      context: ./certbot
      args:
        CERTBOT_VERSION: ${CERTBOT_VERSION:-v5.7.0}
    image: oneinstack/certbot:${CERTBOT_VERSION:-v5.7.0}
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/acme:/var/www/acme"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/certs:/etc/letsencrypt"
    networks:
      - frontend

  ftp:
    <<: *auxiliary-limits
    profiles: ["ftp"]
    build:
      context: ./ftp
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: oneinstack/pure-ftpd:1
    restart: unless-stopped
    environment:
      FTP_PUBLIC_HOST: ${FTP_PUBLIC_HOST:-}
      FTP_PASSIVE_START: ${FTP_PASSIVE_START:-30000}
      FTP_PASSIVE_END: ${FTP_PASSIVE_END:-30009}
      FTP_MAX_CLIENTS: ${FTP_MAX_CLIENTS:-50}
      FTP_MAX_CLIENTS_PER_IP: ${FTP_MAX_CLIENTS_PER_IP:-5}
      FTP_TLS_MODE: ${FTP_TLS_MODE:-required}
      FTP_TLS_DOMAIN: ${FTP_TLS_DOMAIN:-}
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
    ports:
      - "${FTP_BIND:-0.0.0.0}:${FTP_PORT:-21}:21"
      - "${FTP_BIND:-0.0.0.0}:${FTP_PASSIVE_START:-30000}-${FTP_PASSIVE_END:-30009}:${FTP_PASSIVE_START:-30000}-${FTP_PASSIVE_END:-30009}"
    volumes:
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/www:/var/www/html"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/certs:/etc/letsencrypt:ro"
      - "${ONEINSTACK_DATA_DIR:?ONEINSTACK_DATA_DIR must be set}/ftp:/etc/pure-ftpd"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "21"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - frontend

networks:
  frontend:
    name: ${COMPOSE_PROJECT_NAME:-oneinstack}_frontend
    driver: bridge
  backend:
    name: ${COMPOSE_PROJECT_NAME:-oneinstack}_backend
    driver: bridge
    internal: true
    attachable: true
  egress:
    name: ${COMPOSE_PROJECT_NAME:-oneinstack}_egress
    driver: bridge

secrets:
  apisix_admin_key:
    file: "${APISIX_ADMIN_KEY_FILE:?APISIX_ADMIN_KEY_FILE must be set}"
  database_password:
    file: "${DATABASE_PASSWORD_FILE:?DATABASE_PASSWORD_FILE must be set}"
  mysql_root_password:
    file: "${MYSQL_ROOT_PASSWORD_FILE:?MYSQL_ROOT_PASSWORD_FILE must be set}"
  mongodb_root_password:
    file: "${MONGODB_ROOT_PASSWORD_FILE:?MONGODB_ROOT_PASSWORD_FILE must be set}"
  redis_password:
    file: "${REDIS_PASSWORD_FILE:?REDIS_PASSWORD_FILE must be set}"
