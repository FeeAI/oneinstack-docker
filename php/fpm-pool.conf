[www]
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 2
pm.max_spare_servers = 6
ping.path = /ping
ping.response = pong
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
